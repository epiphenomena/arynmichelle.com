<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryn Michelle | Official Website</title>
    <style>
        :root {
            --color-background: #000;
            --color-text-primary: #fff;
            --color-text-secondary: rgba(255, 255, 255, 0.9);
            --color-overlay: rgba(0, 0, 0, 0.5);
            --color-border: rgba(255, 255, 255, 0.4);
            --color-border-mobile: rgba(255, 255, 255, 0.2);
            --color-quadrant-hover: rgba(255, 255, 255, 0.05);
            --color-center-box-bg: rgba(20, 20, 20, 0.85);
            --color-shadow: rgba(0, 0, 0, 0.5);
            --color-social-hover: #aaa;
        }

        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body and HTML Styling */
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: var(--color-background);
            color: var(--color-text-primary);
        }

        /* Background Image Container */
        .bg-image-container {
            height: 100%;
            width: 100%;
            background-image: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: grayscale(80%);
            position: relative;
            display: flex;
            flex-direction: column;
            animation: fadeIn 1s ease-in;
        }

        /* Dark Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background-color: var(--color-overlay);
            z-index: 1;
        }

        /* Main Grid Layout */
        .main-grid {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100%;
            width: 100%;
        }

        /* Quadrant Links */
        .quadrant-link {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background-color: var(--color-border-mobile);
            color: var(--color-text-primary);
            text-decoration: none;
            border: 1px solid var(--color-border);
            position: relative;
            transition: background-color 0.3s ease-in-out;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Staggered animation delays */
        .quadrant-link:nth-child(1) { border-width: 0 1px 1px 0; animation-delay: 0.6s; }
        .quadrant-link:nth-child(2) { border-width: 0 0 1px 0; animation-delay: 0.7s; }
        .quadrant-link:nth-child(3) { border-width: 0 1px 0 0; animation-delay: 0.9s; }
        .quadrant-link:nth-child(4) { border-width: 0; animation-delay: 1.1s; }

        .quadrant-link:hover {
            background-color: var(--color-quadrant-hover);
        }

        .quadrant-content {
            transition: transform 0.3s ease-in-out;
        }
        .quadrant-link:hover .quadrant-content {
            transform: scale(1.05);
        }

        .quadrant-title {
            font-size: 2.25rem; /* 36px */
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .quadrant-subtitle {
            color: var(--color-text-secondary);
            margin-top: 0.5rem;
        }

        /* Central Box */
        .center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none; /* Let clicks pass through */
            opacity: 0;
            animation: fadeInScaleUp 0.8s ease-out 0.2s forwards;
        }

        .center-box-content {
            background-color: var(--color-center-box-bg);
            padding: 2.5rem 4rem; /* Increased padding */
            text-align: center;
            border-radius: 0.5rem;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: auto; /* Enable clicks on content */
            box-shadow: 0 10px 25px var(--color-shadow);
        }

        .center-title {
            font-size: 3rem; /* Larger font size */
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        /* Social Media Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem; /* 24px */
            margin-top: 1rem;
        }

        .social-links a {
            color: var(--color-text-primary);
            transition: color 0.2s ease-in-out;
        }

        .social-links a:hover {
            color: var(--color-social-hover);
        }

        .social-links svg {
            width: 1.5rem; /* 24px */
            height: 1.5rem; /* 24px */
        }

        /* Keyframe Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInScaleUp {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .main-grid {
                display: flex;
                flex-direction: column;
            }
            .center-box {
                position: relative; /* Change from absolute */
                order: -1; /* Move to the top */
                transform: none;
                left: auto;
                top: auto;
                width: 100%;
                flex-shrink: 0; /* Prevent it from shrinking */
                padding: 2rem 0;
                animation: fadeIn 0.8s ease-out 0.2s forwards; /* Simpler mobile animation */
            }
            .center-box-content {
                 background-color: transparent;
                 padding: 0;
                 backdrop-filter: none;
                 -webkit-backdrop-filter: none;
                 box-shadow: none;
            }
            .quadrant-link {
                border: 0;
                flex-grow: 1; /* Make sections fill the remaining height */
            }
            .quadrant-title {
                font-size: 1.875rem; /* 30px */
            }
            .center-title {
                font-size: 2rem; /* 32px */
            }
        }
    </style>
</head>
<body>

    <div class="bg-image-container">

        </div>

        <main class="main-grid">

            <a href="template.html" class="quadrant-link">

    </div>

</body>
</html>
